# ============================================================
# pantry-platform — pull-request verification
#
# This repo is submodule pins plus the compose stack, so the only thing
# worth checking is that the PINNED SET is real and coherent:
#
#   1. every pin resolves — checkout with submodules fails on a pin that
#      points at a commit the remote no longer has
#   2. every app pin is an ANCESTOR of that repo's main — a pin must mark a
#      merged commit, never a branch tip. A pin to an unmerged branch is
#      what left this repo diverged from what actually shipped in August.
#   3. docker compose still parses with the pinned set
#   4. the release set: lenient on ordinary PRs (release-set.json, when
#      it exists, is well formed; nothing else changes from 1-3), strict
#      on a release-train PR, i.e. one that changes release-set.json:
#      every pin is the commit of a vX.Y.Z tag, the set names exactly the
#      pins, the pinned pantry-gitops deploys it, GHCR serves the recorded
#      digests, demo/Dockerfile is pinned to them and the api and db seeds
#      are byte-identical (scripts/verify_release_set.py; RELEASING.md)
#
# verify-pins is required by the ruleset on main; release-tools is not.
# ============================================================

name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # ancestry checks need history, in submodules too

      - name: Every app pin is a merged commit on its repo's main
        run: |
          set -euo pipefail
          fail=0
          for sub in pantry-api pantry-db pantry-frontend pantry-gitops pantry-infra; do
            [ -d "$sub/.git" ] || [ -f "$sub/.git" ] || { echo "::error::$sub did not check out"; fail=1; continue; }
            git -C "$sub" fetch -q origin main
            pin=$(git -C "$sub" rev-parse --short HEAD)
            if git -C "$sub" merge-base --is-ancestor HEAD origin/main; then
              echo "ok    $sub @ $pin is on main"
            else
              echo "::error::$sub pinned at $pin is NOT on that repo's main — pins must point at merged commits"
              fail=1
            fi
          done
          exit $fail

      - name: Release set (lenient on ordinary PRs, strict on train PRs)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        # --fetch and --registry act only in strict mode: submodule tags,
        # and anonymous GHCR reads of the recorded digests.
        run: python3 scripts/verify_release_set.py --mode auto --base "origin/$BASE_REF" --fetch --registry

      - name: Compose stack parses with the pinned set
        run: docker compose config --quiet && echo "compose config ok"

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for the release tooling (stdlib only; GitHub and GHCR are fakes)
        run: |
          python3 -m unittest discover -s .github/actions/semver-labels/tests
          python3 -m unittest discover -s scripts
