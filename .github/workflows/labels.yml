# ============================================================
# pantry-platform — release label check
#
# Every PR carries one release label (release:major, release:minor,
# release:patch or release:none); RELEASING.md says which. This job
# checks rules R1-R4 with the semver-labels action in this repo and
# prints what version merging the PR next would release.
#
# ADVISORY for now: a broken rule is a warning, not a failure, and
# the job is not a required check. Making it required is the owner's
# call (a ruleset change), after a few weeks of labelled PRs.
#
# Read-only: the token can read PRs and contents, nothing else.
# ============================================================

name: labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the prediction reads tags and first-parent history

      - name: Release label (advisory)
        uses: ./.github/actions/semver-labels
        with:
          command: check-pr
          advisory: "true"
          predict-ref: origin/${{ github.base_ref }}
