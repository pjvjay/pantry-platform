# Render Blueprint: the whole app, privately, and the free public demo.
#
# Private app (behind a login, live Gemini, Postgres, the hub), built from this
# repo's pinned submodules, so a deploy is always the known-good set the verify workflow checked:
#
#   browser ─▶ pantry-web (nginx, login) ─┬─ /pantry/      the console
#                                         ├─ /pantry/api/ ─▶ pantry-api ─▶ pantry-db (Postgres)
#                                         └─ /hub/        ─▶ pantry-hub  ─▶ pantry-api (MCP)
#
# Every push to main redeploys the private stack unless it only touched docs, the public demo or
# scripts (buildFilter ignoredPaths); moving a submodule pin is a deploy.
# pantry-api's pre-deploy step applies pantry-db's migrations and seed (deploy/migrate.py), the
# demo origin evidence, and fills the matching cache with common ingredient names. Values marked sync: false are entered in the dashboard on the first
# deploy and never stored here. Setup steps: docs/render.md.
#
# Public demo (pantry-planner-demo): one free container in DEMO_MODE, as before.

databases:
  - name: pantry-db
    databaseName: pantry
    user: pantry_app
    plan: basic-256mb
    postgresMajorVersion: "17"
    region: oregon

services:
  - type: web
    name: pantry-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./deploy/web.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - demo/**
        - scripts/**
        - .github/**
    envVars:
      - key: API_UPSTREAM
        fromService: {type: pserv, name: pantry-api, property: hostport}
      - key: HUB_UPSTREAM
        fromService: {type: pserv, name: pantry-hub, property: hostport}
      - key: REQUIRE_AUTH
        value: "1"
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false

  - type: pserv
    name: pantry-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    preDeployCommand: /predeploy.sh
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - demo/**
        - scripts/**
        - .github/**
    envVars:
      - key: DB_HOST
        fromDatabase: {name: pantry-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: pantry-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: pantry-db, property: database}
      - key: DB_USER
        fromDatabase: {name: pantry-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: pantry-db, property: password}
      - key: LOAD_DEMO_ORIGINS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: SELECTOR_MODEL_DEFAULT
        value: gemini:gemini-3.1-flash-lite
      - key: SELECTOR_MODEL_ESCALATION
        value: gemini:gemini-3.5-flash
      - key: CLASSIFIER_MODEL
        value: gemini:gemini-3.1-flash-lite
      - key: NL2SQL_MODEL
        value: gemini:gemini-3.5-flash
      - key: LLM_DAILY_COST_CAP_USD
        value: "5"
      # Matching by meaning for recipe names the seeds don't know: Gemini's embedding API and a
      # Flash-Lite describer, cached in Postgres, within the free tier's daily allowance.
      - key: OLLAMA_URL
        value: ""
      - key: EMBEDDING_MODEL
        value: gemini:gemini-embedding-001
      - key: DESCRIBER_MODEL
        value: gemini:gemini-3.1-flash-lite
      - key: MATCHING_DAILY_EMBED_TEXTS
        value: "900"
      - key: MATCHING_DAILY_DESCRIBE_CALLS
        value: "200"
      - key: PREFILL_MATCHING
        value: "1"
      - key: MCP_AUTH_TOKENS
        sync: false

  - type: pserv
    name: pantry-hub
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./deploy/hub.Dockerfile
    dockerContext: .
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - demo/**
        - scripts/**
        - .github/**
    disk:
      name: hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PANTRY_API_HOSTPORT
        fromService: {type: pserv, name: pantry-api, property: hostport}
      - key: GEMINI_API_KEY
        sync: false
      - key: PANTRY_MCP_TOKEN
        sync: false
      # The public address of pantry-web (or your domain), e.g. pantry-web.onrender.com:
      # the hub answers only to it, and Google sign-in returns to it.
      - key: HUB_ALLOWED_HOSTS
        sync: false
      - key: HUB_OAUTH_ORIGINS
        sync: false
      # Google Calendar sync: the OAuth client JSON, added as a Secret File of this name.
      - key: GOOGLE_OAUTH_CLIENT_FILE
        value: /etc/secrets/google_oauth_client.json
      - key: GOOGLE_CALENDAR_TOKEN_FILE
        value: /var/data/google_calendar_token.json

  # The free public demo: one container in DEMO_MODE (no keys, no hub), composed from the GHCR
  # images. Spins down after 15 min idle; the first request after that takes about a minute.
  - type: web
    name: pantry-planner-demo
    runtime: docker
    plan: free
    dockerfilePath: demo/Dockerfile
    dockerContext: demo
    healthCheckPath: /pantry/api/health
    autoDeploy: true
    buildFilter:
      paths:
        - demo/**
        - render.yaml
