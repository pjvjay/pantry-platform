[project]
name = "pantry-demo-hub"
version = "0.1.0"
description = "One browser entry point for the pantry stack: planner, catalog, provenance, MCP explorer, agent and simulations."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
  # The same MCP SDK as pantry-api and mcp-sim (2.x speaks streamable HTTP through httpx2).
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools]
packages = ["demo_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
